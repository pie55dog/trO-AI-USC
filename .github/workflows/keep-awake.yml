# Render's free plan puts the backend to sleep after 15 idle minutes, and
# waking takes up to a minute. This pings it every 10 minutes so it's awake
# for the demo. GitHub may run scheduled jobs a few minutes late.
#
# Uses the same repo variable as the Pages build (VITE_API_URL). Turn it off
# with Actions > "Keep backend awake" > ... > Disable workflow.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.VITE_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.VITE_API_URL }}/health"
