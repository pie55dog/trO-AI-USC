# Deploys the mobile web app (frontend/) to GitHub Pages for phone testing.
#
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# Optional: set the repo variable VITE_API_URL (Settings > Secrets and
# variables > Actions > Variables) to an HTTPS URL of a running backend.
# Without it the screens load but anything that saves will show a
# "can't reach the server" error, since Pages can only host static files.
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  # Pull requests run the build and tests only, so a broken build shows up
  # before merge instead of failing the deploy.
  pull_request:
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # Pages serves the site from /<repo>/, so build with that base path.
      - run: npx vite build --base="/${{ github.event.repository.name }}/"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # Pages has no SPA fallback. Serving index.html as the 404 page lets
      # deep links like /e/1?b=ABC (the bracelet tap link) still open the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
